name: Logo Preview (Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update, e.g. v1.0.19
        required: true

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1

      - run: bun i

      - id: preview
        uses: ./.github/actions/logo-preview
        with:
          to: ${{ env.TAG }}
          key: release-${{ env.TAG }}

      - name: Append to release notes
        if: steps.preview.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.preview.outputs.markdown-file }}
        run: |
          set -euo pipefail
          start="<!-- svgl-logo-preview:start -->"
          end="<!-- svgl-logo-preview:end -->"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/body.md"
          # Drop a previous preview section so re-runs replace it.
          awk -v s="$start" -v e="$end" '$0==s{skip=1} !skip{print} $0==e{skip=0}' \
            "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/notes.md"
          { echo; echo "$start"; cat "$FILE"; echo "$end"; } >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
